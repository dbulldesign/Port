<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Port</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Port">
<meta name="application-name" content="Port">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--card:#1A1A1C;--card2:#2A2A2D;--sheet:#141416;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.32);--label4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.12);
  --tint:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;
  --glass:rgba(28,28,30,.75);--glass-line:rgba(255,255,255,.1);
  --cal-bg:#FFFFFF;--cal-ink:#000;--cal-ink2:rgba(60,60,67,.6);--cal-ink3:rgba(60,60,67,.35);--cal-line:rgba(60,60,67,.16);--cal-fill:rgba(120,120,128,.14);
  --shadow:0 12px 44px rgba(0,0,0,.6);
  --hour:84px;--dh:96px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.2,.3,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cal-bg:#101012;--cal-ink:#fff;--cal-ink2:rgba(235,235,245,.6);--cal-ink3:rgba(235,235,245,.35);--cal-line:rgba(84,84,88,.45);--cal-fill:rgba(120,120,128,.26)}}
:root[data-theme="dark"]{--cal-bg:#101012;--cal-ink:#fff;--cal-ink2:rgba(235,235,245,.6);--cal-ink3:rgba(235,235,245,.35);--cal-line:rgba(84,84,88,.45);--cal-fill:rgba(120,120,128,.26)}
html{height:100%;background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;background:#000;color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left;touch-action:manipulation}
input,select,textarea{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
svg{display:block}
.press{transition:transform .15s var(--ease),opacity .15s}
.press:active{transform:scale(.95);opacity:.7}
.tabular{font-variant-numeric:tabular-nums}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:.3;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.3;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes scalein{from{opacity:0;transform:scale(.6)}60%{transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,69,58,.45)}50%{box-shadow:0 0 0 6px rgba(255,69,58,0)}}
@keyframes focusin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes numin{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.anim-l{animation:slideL .32s var(--ease)}
.anim-r{animation:slideR .32s var(--ease)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* calendar card */
.cal{flex:none;position:relative;margin:4px 8px 0;border-radius:30px;background:var(--cal-bg);color:var(--cal-ink);overflow:hidden;
  transition:height .5s var(--ease);box-shadow:0 2px 0 rgba(255,255,255,.03) inset}
.cal.resizing{transition:none}
.cal .timeline{position:absolute;left:0;right:0;top:0;bottom:var(--dh);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.cal.min .timeline{display:none}
.datehead{position:absolute;left:0;right:0;bottom:0;height:var(--dh);display:flex;align-items:center;justify-content:space-between;padding:0 26px 6px 24px;
  background:var(--cal-bg);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;z-index:7}
.datehead::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--cal-line)}
.datehead .wd{font-size:40px;font-weight:600;letter-spacing:-.8px;display:flex;align-items:flex-end;gap:5px;line-height:1}
.datehead .wd i{width:9px;height:9px;border-radius:50%;background:var(--red);margin-bottom:5px;flex:none}
.datehead .mo{font-size:19px;font-weight:500;color:var(--cal-ink2);padding:6px 8px;border-radius:9px}
.datehead .dn{font-size:66px;font-weight:600;letter-spacing:-2.5px;line-height:1;font-variant-numeric:tabular-nums}
.datehead button{color:inherit}
.calpills{position:absolute;top:10px;right:12px;display:flex;gap:8px;z-index:8}
.cal.min .calpills{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--cal-ink);
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:inset 0 0 0 .5px var(--glass-line);color:#fff}
.pill.live{background:var(--c);color:#fff}
.pill.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
.pill svg{width:15px;height:15px}
.tl-head{display:grid;grid-template-columns:62px repeat(var(--n),minmax(0,1fr));position:sticky;top:0;z-index:6;background:var(--cal-bg)}
.tl-head .dhd{padding:8px 10px 6px;font-size:12px;color:var(--cal-ink2);letter-spacing:.3px;border-bottom:.5px solid var(--cal-line)}
.tl-head .dhd b{display:block;color:var(--cal-ink);font-size:20px;font-weight:600;letter-spacing:-.4px}
.tl-head .dhd.today b{color:var(--red)}
.tl-grid{display:grid;grid-template-columns:62px repeat(var(--n),minmax(0,1fr));position:relative;padding-top:18px;padding-bottom:40px}
.gutter{position:relative}
.gutter span{position:absolute;right:10px;transform:translateY(-50%);font-size:12px;font-weight:500;color:var(--cal-ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.gutter .nowlbl{color:var(--red);background:var(--cal-bg);padding:1px 4px;border-radius:5px;font-weight:600;z-index:4}
.daycol{position:relative;cursor:cell;-webkit-user-select:none;user-select:none;
  background-image:repeating-linear-gradient(to bottom,var(--cal-line) 0 .5px,transparent .5px var(--hour))}
.daycol+.daycol{border-left:.5px solid var(--cal-line)}
.block{position:absolute;border-radius:14px;padding:9px 12px;overflow:hidden;cursor:pointer;z-index:2;color:var(--cal-ink);
  background:color-mix(in srgb,var(--c) 22%,var(--cal-bg));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:box-shadow .2s,transform .2s var(--ease),opacity .2s}
.block.past{opacity:.5}
.block.focusing{box-shadow:0 0 0 2px var(--c)}
.block.drop{transform:scale(1.03);box-shadow:0 0 0 2.5px var(--c),var(--shadow);z-index:5;opacity:1}
.block.dragging{opacity:.2}
.block.fresh{animation:scalein .4s var(--spring)}
.block .bh{display:flex;align-items:center;gap:9px}
.block .bic{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.block .bic svg{width:14px;height:14px}
.block .bt{font-weight:600;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.block .bd{font-size:12px;font-weight:600;color:var(--cal-ink2);background:color-mix(in srgb,var(--c) 22%,transparent);padding:3px 7px;border-radius:7px;flex:none}
.block .bm{font-size:13.5px;color:var(--cal-ink2);margin:3px 0 0 35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block ul{list-style:none;margin:5px 0 0 35px;font-size:13px;color:var(--cal-ink2)}
.block li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:7px;align-items:center;line-height:18px}
.block li i{width:10px;height:10px;border-radius:50%;border:1.3px solid var(--cal-ink3);flex:none}
.block li.done{text-decoration:line-through;opacity:.6}
.block li.done i{background:var(--cal-ink3)}
.block li.more i{border:0}
.block.preview{opacity:.9;border:1.5px dashed var(--c);background:color-mix(in srgb,var(--c) 14%,var(--cal-bg));pointer-events:none;z-index:4;animation:fadein .15s}
.block.provisional{z-index:6;box-shadow:0 0 0 2px var(--c),var(--shadow);animation:scalein .35s var(--spring)}
.block.provisional input{width:100%;background:none;border:0;outline:none;font-size:16px;font-weight:600;color:var(--cal-ink);padding:0}
.block.provisional input::placeholder{color:var(--cal-ink3)}
.nowline{position:absolute;left:0;right:0;height:1.5px;background:var(--red);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.empty-day{position:absolute;left:0;right:0;top:34%;text-align:center;color:var(--cal-ink2);font-size:14px;padding:0 30px;pointer-events:none;line-height:1.45}
.empty-day b{display:block;color:var(--cal-ink);font-weight:600;font-size:17px;margin-bottom:4px}
.timebadge{position:absolute;left:4px;top:0;transform:translateY(-50%);font-size:11px;font-weight:700;color:#fff;background:var(--tint);padding:3px 7px;border-radius:7px;z-index:9;pointer-events:none;white-space:nowrap}
.dropline{position:absolute;left:0;right:0;height:2px;background:var(--tint);z-index:8;pointer-events:none;border-radius:1px}
.ghost{position:fixed;z-index:100;pointer-events:none;border-radius:14px;box-shadow:var(--shadow);transform-origin:center;transition:transform .09s linear,opacity .2s;will-change:transform}
.ghost.fly{transition:transform .28s var(--ease),opacity .28s,width .28s,height .28s,left .28s,top .28s}
.ghost .inner{border-radius:14px;background:var(--card)}

/* desk */
.desk{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.todo-card{flex:0 1 auto;min-height:0;margin:10px 10px 0;background:var(--card);border-radius:28px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 0 6px}
.todo-h{display:flex;align-items:center;gap:12px;padding:4px 22px 6px;color:var(--label3);font-size:14px;font-weight:500}
.todo-h .dotted{width:18px;height:18px;border-radius:50%;border:1.5px dotted var(--label3);flex:none;margin-left:2px}
.todo-h .more{margin-left:auto;color:var(--label3);font-size:20px;padding:0 6px;line-height:1;letter-spacing:1px}
.list{list-style:none}
.list.enter li{animation:rowin .36s var(--ease) both;animation-delay:calc(var(--i,0)*22ms)}
.task{position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.task .inner{display:flex;align-items:center;gap:14px;padding:9px 22px;background:var(--card);position:relative;z-index:2;transition:transform .28s var(--ease);min-height:48px}
.task .inner.noanim{transition:none}
.task.dragging{opacity:.3}
.task.removing{animation:collapse .3s forwards}
@keyframes collapse{to{height:0;opacity:0;padding:0}}
.check{width:23px;height:23px;border-radius:50%;border:1.6px solid var(--label3);flex:none;display:grid;place-items:center;transition:border-color .15s,background .15s}
.check svg{width:13px;height:13px;stroke:#fff;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s .05s}
.check.on{background:var(--c,var(--tint));border-color:var(--c,var(--tint))}
.check.on svg{stroke-dashoffset:0}
.check.pulse{animation:pop .35s var(--spring)}
.tt{flex:1;min-width:0;padding:0;display:flex;align-items:center;gap:10px}
.tt .name{font-size:18px;font-weight:500;line-height:1.25;overflow-wrap:anywhere;flex:1;min-width:0}
.task.done .name{color:var(--label3);text-decoration:line-through}
.tt .right{flex:none;text-align:right;font-size:11.5px;line-height:1.25;color:var(--label3);font-weight:500}
.tt .right .over{color:var(--red)}
.tt .right .urg{font-size:15px;font-weight:700;letter-spacing:-.06em;color:var(--c,var(--tint))}
.tt .right .blk{display:inline-flex;align-items:center;gap:4px}
.tt .right .blk svg{width:12px;height:12px}
.swl{position:absolute;inset:0;background:var(--green);display:flex;align-items:center;padding-left:24px;color:#fff;z-index:1}
.swl svg{width:24px;height:24px;transform:scale(.6);opacity:0;transition:.15s}
.task.armed .swl svg{transform:scale(1);opacity:1}
.swr{position:absolute;top:0;bottom:0;right:0;display:flex;z-index:1}
.swr button{width:80px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500}
.swr button svg{width:22px;height:22px}
.swr .mv{background:var(--tint)} .swr .del{background:var(--red)}
.divider{display:flex;align-items:center;gap:12px;padding:10px 22px 4px;font-size:13px;color:var(--label3);font-weight:500}
.divider::after{content:"";flex:1;height:.5px;background:var(--sep)}
.divider.btn{cursor:pointer}
.divider svg{width:16px;height:16px}
.newrow{display:flex;align-items:center;gap:14px;padding:9px 22px 8px;color:var(--c,var(--tint));font-size:18px;font-weight:500;width:100%;min-height:48px}
.newrow .plus{width:23px;height:23px;border-radius:50%;background:var(--c,var(--tint));color:#000;display:grid;place-items:center;flex:none}
.newrow .plus svg{width:13px;height:13px}
.newrow.dim{color:var(--label3)} .newrow.dim .plus{background:var(--label4);color:var(--card)}
.newrow input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:18px;font-weight:500;color:var(--label);padding:0}
.newrow input::placeholder{color:var(--label3)}
.newtoolbar{display:flex;gap:8px;padding:2px 22px 10px 59px;flex-wrap:wrap;animation:rowin .25s var(--ease)}
.newtoolbar button{padding:5px 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;color:var(--label2);transition:.15s}
.newtoolbar button.on{background:var(--c,var(--tint));color:#fff}
.newtoolbar .ugrp{display:flex;background:var(--fill);border-radius:999px;padding:2px}
.newtoolbar .ugrp button{background:none;padding:3px 10px}
.newtoolbar .ugrp button.on{background:var(--c,var(--tint))}
.empty{color:var(--label3);padding:16px 22px 18px;font-size:15px;line-height:1.45}
.empty b{color:var(--label2);font-weight:600;display:block;font-size:16px;margin-bottom:3px}

/* project bar */
.projbar{flex:none;display:flex;align-items:center;gap:30px;padding:14px 22px 16px;overflow-x:auto;scrollbar-width:none;border-top:.5px solid var(--sep);margin-top:12px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.projbar::-webkit-scrollbar{display:none}
.proj{display:flex;align-items:center;gap:12px;color:var(--label3);font-size:30px;font-weight:700;letter-spacing:-.8px;white-space:nowrap;flex:none;scroll-snap-align:start;
  transition:color .3s,transform .3s var(--ease);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.proj.on{color:var(--label)}
.proj .pic{width:42px;height:42px;border-radius:50%;background:var(--card2);color:#fff;display:grid;place-items:center;flex:none;transition:background .3s,transform .3s var(--spring)}
.proj.on .pic{background:var(--c,#555);transform:scale(1.05)}
.proj .pic svg{width:20px;height:20px}
.proj .cnt{font-size:17px;font-weight:500;color:var(--label3);margin-left:-4px;align-self:flex-end;margin-bottom:5px}
.proj.add .pic{background:var(--card2);color:var(--label2)}
.proj.drop .pic{transform:scale(1.25);box-shadow:0 0 0 3px var(--tint)}
.proj.drop{color:var(--label)}
.proj.gear{margin-left:auto}
.proj.gear .pic{background:transparent;color:var(--label3)}

/* focus */
.focusview{position:absolute;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;animation:focusin .35s var(--ease);padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.focusview .top{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;padding:20px 10px}
.focusview .kicker{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600}
.focusview .kicker .bic{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.focusview .kicker .bic svg{width:17px;height:17px}
.focusview .big{font-size:96px;font-weight:700;letter-spacing:-4px;line-height:1;color:var(--c);margin:14px 0 8px;font-variant-numeric:tabular-nums;animation:numin .5s var(--spring)}
.focusview .big small{font-size:.6em;letter-spacing:-2px}
.focusview .sub{font-size:15px;color:var(--label2)}
.focusview .bar{width:160px;height:4px;border-radius:2px;background:var(--fill);margin:18px auto 0;overflow:hidden}
.focusview .bar i{display:block;height:100%;background:var(--c);width:0;transition:width 1s linear}
.focusview .todo-card{flex:0 1 auto;max-height:46%;margin:0 0 12px;animation:rowin .4s var(--ease) .1s both}
.focusview .btn{animation:rowin .4s var(--ease) .18s both}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px 16px;border-radius:16px;font-weight:600;font-size:17px;background:var(--card);color:var(--label);text-align:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.8}
.btn.primary{background:var(--c,var(--tint));color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px;flex:none}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px);animation:fadein .2s}
.overlay[hidden]{display:none}
.sheet{background:var(--sheet);width:100%;max-height:calc(100% - 20px);border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .4s var(--spring);will-change:transform}
.sheet.closing{transition:transform .22s ease-in;transform:translateY(100%)}
.grab{flex:none;height:18px;position:relative;cursor:grab;touch-action:none}
.grab::before{content:"";position:absolute;left:50%;top:7px;width:36px;height:5px;border-radius:3px;background:var(--label4);transform:translateX(-50%)}
.snav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px 8px;min-height:40px;touch-action:none}
.snav .l{justify-self:start;color:var(--tint);font-size:17px;padding:6px 0}
.snav .r{justify-self:end;color:var(--tint);font-size:17px;font-weight:600;padding:6px 0}
.snav h2{font-size:17px;font-weight:600;text-align:center}
.sbody{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.shead{padding:4px 16px 12px}
.shead h2{font-size:22px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.shead .sub{font-size:15px;color:var(--label2);margin-top:3px}
.shead .bic{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.shead .bic svg{width:18px;height:18px}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.card+.card,.card+.fnote+.card{margin-top:14px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;background:var(--card);position:relative}
.frow+.frow::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.frow label{flex:none;font-size:17px;min-width:84px}
.frow .val{flex:1;min-width:0;text-align:right;color:var(--label2);font-size:17px}
.frow input[type=text],.frow input:not([type]),.frow textarea{flex:1;min-width:0;background:none;border:0;outline:none;font-size:17px;padding:0}
.frow input[type=date],.frow input[type=time]{margin-left:auto;background:var(--fill);border:0;border-radius:8px;padding:5px 10px;font-size:16px;color:var(--label);outline:none}

/* ============ state & persistence (standalone: local first, GitHub Gist sync) ============ */
const COLLS=['projects','tasks','blocks','routines','days','objectives'];
const state={projects:{},tasks:{},blocks:{},routines:{},days:{},objectives:{},settings:{dayStart:6,dayEnd:23,theme:'auto',notify:false,days:3},del:Object.fromEntries(COLLS.map(c=>[c,{}]))};
const ui={view:'today',date:todayYmd(),page:null,focusBlockId:null,showDone:false,tray:'closed',scrolledToNow:false};
const LS_KEY='port-planner-v1';

const GIST_FILE='port-sync.json';
const LEGACY_FILE='harbor-sync.json';
/* carry over anything saved while the app was called Harbor */
(function migrateName(){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('harbor-'))ks.push(k)}ks.forEach(k=>{const nk='port-'+k.slice(7);if(localStorage.getItem(nk)===null)localStorage.setItem(nk,localStorage.getItem(k))})}catch(e){}})();
const TOKEN_URL='https://github.com/settings/tokens/new?scopes=gist&description=Port%20sync';
const secrets={token:''};
let dbStatus='local';
const sync={file:GIST_FILE,gistId:null,etag:null,lastAt:0,timer:null,busy:false,dirty:false,login:'',error:'',share:false};
const materialized=new Set();
const inflight=new Map();

function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);
    for(const k of COLLS)if(d[k]&&typeof d[k]==='object')state[k]=d[k];
    if(d.settings)Object.assign(state.settings,d.settings);if(d.del)for(const k in state.del)if(d.del[k])state.del[k]=d.del[k]}}catch(e){}
  try{const s=localStorage.getItem(SEC_KEY);if(s)Object.assign(secrets,JSON.parse(s));sync.gistId=localStorage.getItem(LS_KEY+':gist')||null;sync.login=localStorage.getItem(LS_KEY+':login')||''}catch(e){}
  if(secrets.token&&sync.gistId)dbStatus='synced';
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function saveSecrets(){try{localStorage.setItem(SEC_KEY,JSON.stringify(secrets));if(sync.gistId)localStorage.setItem(LS_KEY+':gist',sync.gistId);localStorage.setItem(LS_KEY+':login',sync.login||'')}catch(e){}}
function put(coll,id,data){
  if(data===null){delete state[coll][id];state.del[coll][id]=Date.now()}else{state[coll][id]={...data,u:Date.now()};delete state.del[coll][id]}
  saveLocal();scheduleSync();
}
function saveSettings(){state.settings.u=Date.now();saveLocal();applyTheme();scheduleSync()}
function scheduleSync(){if(!secrets.token||!sync.gistId)return;sync.dirty=true;clearTimeout(sync.timer);sync.timer=setTimeout(()=>runSync(),1200)}
function exportState(){const o={v:1,settings:state.settings,del:state.del};COLLS.forEach(c=>o[c]=state[c]||{});return o}
function stable(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return'['+o.map(stable).join(',')+']';return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}'}
function mergeStates(L,R){
  const out={v:1,settings:null,del:Object.fromEntries(COLLS.map(c=>[c,{}]))};COLLS.forEach(c=>out[c]={});
  const cutoff=Date.now()-30*86400000;
  for(const coll of COLLS){
    const Ld=L[coll]||{},Rd=R[coll]||{},Lt=(L.del&&L.del[coll])||{},Rt=(R.del&&R.del[coll])||{};
    const ids=new Set([...Object.keys(Ld),...Object.keys(Rd),...Object.keys(Lt),...Object.keys(Rt)]);
    for(const id of ids){
      const lu=Ld[id]?(Ld[id].u||1):-1,ru=Rd[id]?(Rd[id].u||1):-1,lt=Lt[id]||-1,rt=Rt[id]||-1;
      const best=Math.max(lu,ru,lt,rt);if(best<0)continue;
      if(best===lu)out[coll][id]=Ld[id];else if(best===ru)out[coll][id]=Rd[id];
      else{const ts=Math.max(lt,rt);if(ts>cutoff)out.del[coll][id]=ts}
    }
  }
  const ls=L.settings||{},rs=R.settings||{};out.settings=((ls.u||0)>=(rs.u||0))?ls:{...ls,...rs};
  return out;
}
async function gh(path,opts={}){
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Authorization':'Bearer '+secrets.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});
  return r;
}
async function connectSync(token){
  secrets.token=(token||'').trim();if(!secrets.token)throw new Error('Paste the token first.');
  const r=await gh('/user');
  if(r.status===401)throw new Error('GitHub rejected that token. Check it was copied completely.');
  if(!r.ok)throw new Error('GitHub replied '+r.status+'. Try again in a moment.');
  const u=await r.json();sync.login=u.login||'';
  let found=null;
  for(let page=1;page<=5&&!found;page++){const l=await gh('/gists?per_page=100&page='+page);if(!l.ok)break;const arr=await l.json();found=arr.find(g=>g.files&&(g.files[GIST_FILE]||g.files[LEGACY_FILE]));if(arr.length<100)break}
  if(found){sync.gistId=found.id;sync.file=found.files[GIST_FILE]?GIST_FILE:LEGACY_FILE}
  else{const c=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Port planner sync (private)',public:false,files:{[GIST_FILE]:{content:JSON.stringify(exportState())}}})});
    if(!c.ok)throw new Error(c.status===404||c.status===403?'The token can’t create gists. Make sure only the “gist” box is ticked when creating it.':'Could not create the sync file ('+c.status+').');
    const g=await c.json();sync.gistId=g.id;sync.etag=c.headers.get('etag')}
  saveSecrets();dbStatus='synced';sync.error='';await runSync(true);
}
function disconnectSync(){secrets.token='';sync.gistId=null;sync.login='';sync.etag=null;sync.error='';dbStatus='local';saveSecrets();try{localStorage.removeItem(LS_KEY+':gist')}catch(e){}}
async function runSync(){
  if(!secrets.token||!sync.gistId)return;if(sync.busy){sync.dirty=true;return}
  if(typeof navigator!=='undefined'&&navigator.onLine===false){dbStatus='offline';renderStatus();return}
  sync.busy=true;dbStatus='syncing';renderStatus();
  try{
    const r=await gh('/gists/'+sync.gistId,{headers:sync.etag?{'If-None-Match':sync.etag}:{}});
    let remote=null;
    if(r.status===304){}
    else if(r.ok){sync.etag=r.headers.get('etag');const g=await r.json();const fname=g.files&&g.files[GIST_FILE]?GIST_FILE:(g.files&&g.files[LEGACY_FILE]?LEGACY_FILE:GIST_FILE);sync.file=fname;if(fname===LEGACY_FILE)sync.dirty=true;const f=g.files&&g.files[fname];let content=f?f.content:'';if(f&&f.truncated&&f.raw_url){const rr=await fetch(f.raw_url);content=await rr.text()}try{remote=JSON.parse(content||'{}')}catch(e){remote={}}}
    else if(r.status===404)throw new Error('The sync file is missing on GitHub. Set up sync again.');
    else if(r.status===401)throw new Error('GitHub rejected the token. Set up sync again.');
    else throw new Error('GitHub replied '+r.status);
    if(remote){
      const before=stable(exportState());const merged=mergeStates(exportState(),remote);
      COLLS.forEach(c=>state[c]=merged[c]||{});state.del=merged.del;state.settings={...state.settings,...merged.settings};
      const after=stable(exportState());
      if(after!==before){saveLocal();applyTheme();materialized.clear();syncRoutines();scheduleRender()}
      sync.dirty=after!==stable(remote)||sync.file===LEGACY_FILE;
    }
    if(sync.file===LEGACY_FILE)sync.dirty=true;
    if(sync.dirty){const legacy=sync.file===LEGACY_FILE;const body=legacy?{description:'Port planner sync (private)',files:{[LEGACY_FILE]:{filename:GIST_FILE,content:JSON.stringify(exportState())}}}:{files:{[GIST_FILE]:{content:JSON.stringify(exportState())}}};
      const w=await gh('/gists/'+sync.gistId,{method:'PATCH',body:JSON.stringify(body)});
      if(w.status===401)throw new Error('GitHub rejected the token. Set up sync again.');if(!w.ok)throw new Error('Could not save to GitHub ('+w.status+').');sync.etag=w.headers.get('etag');sync.dirty=false;sync.file=GIST_FILE}
    sync.lastAt=Date.now();sync.error='';dbStatus='synced';
  }catch(e){sync.error=(e&&e.message)||'Sync failed';dbStatus=navigator.onLine===false?'offline':'error'}
  sync.busy=false;renderStatus();if(sync.dirty)scheduleSync();
}
function renderStatus(){const el=$('.sync-status');if(el)el.innerHTML=syncStatusText();const dot=$('.syncdot');if(dot)dot.className='syncdot '+dbStatus}
function ago(t){if(!t)return'';const s=Math.round((Date.now()-t)/1000);return s<5?'just now':s<60?s+'s ago':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}
function syncStatusText(){
  if(!secrets.token||!sync.gistId)return'Not set up. This device only.';
  if(dbStatus==='syncing')return'Syncing…';if(dbStatus==='offline')return'Offline. Changes will sync when you’re back online.';
  if(dbStatus==='error')return'Sync problem: '+esc(sync.error);
  return`Connected as @${esc(sync.login||'GitHub')}${sync.lastAt?', synced '+ago(sync.lastAt):''}`;
}
function initDb(){
  const m=location.hash.match(/^#setup=([A-Za-z0-9_\-]+)/);
  if(m){try{const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));history.replaceState(null,'',location.pathname+location.search);
      if(j.t){connectSync(j.t).then(()=>{toast('Sync connected as @'+sync.login);renderApp()}).catch(e=>toast(e.message))}}catch(e){}}
  else if(secrets.token&&sync.gistId)runSync();
  setInterval(()=>{if(!document.hidden)runSync()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)runSync()});
  window.addEventListener('online',()=>runSync());window.addEventListener('focus',()=>runSync());
  if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Update ready',{label:'Reload',fn:()=>location.reload()})})})}).catch(()=>{})}
}
function setupLink(){const j={t:secrets.token};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(j)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return location.origin+location.pathname+'#setup='+b}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

/* ============ domain helpers ============ */
const tasksArr=()=>Object.values(state.tasks);
const tasksIn=bid=>tasksArr().filter(t=>t.blockId===bid).sort((a,b)=>(a.done-b.done)||(b.urgency-a.urgency)||(a.createdAt-b.createdAt));
const blocksOn=date=>Object.values(state.blocks).filter(b=>b.date===date).sort((a,b)=>a.start-b.start||a.createdAt-b.createdAt);
const blockEnd=b=>b.start+b.duration;
const blockIcon=b=>b.icon||(b.projectId&&state.projects[b.projectId]&&state.projects[b.projectId].icon)||'tag';
function inboxTasks(){return tasksArr().filter(t=>!t.blockId&&!t.done)}
function sortTasks(arr){return arr.sort((a,b)=>(b.urgency-a.urgency)||((a.due||'9')>(b.due||'9')?1:(a.due||'9')<(b.due||'9')?-1:0)||(a.createdAt-b.createdAt))}
function findOrCreateProject(name){
  const lower=name.toLowerCase();
  const found=Object.values(state.projects).find(p=>p.name.toLowerCase()===lower);
  if(found)return found;
  const used=Object.values(state.projects).map(p=>p.color);
  const color=PALETTE.find(c=>!used.includes(c))||PALETTE[Object.keys(state.projects).length%PALETTE.length];
  const id=uid('p');const p={id,name,color,icon:'tag',createdAt:Date.now()};put('projects',id,p);return p;
}
function currentBlock(){
  const n=nowMin();const todays=blocksOn(todayYmd()).filter(b=>b.start<=n&&n<blockEnd(b));
  return todays.sort((a,b)=>b.start-a.start)[0]||null;
}
function nextBlock(){const n=nowMin();return blocksOn(todayYmd()).find(b=>b.start>n)||null}
function visibleDates(){
  if(!isWide())return[ui.date];
  const n=state.settings.days||3;return Array.from({length:n},(_,i)=>shiftYmd(ui.date,i));
}
function syncRoutines(){
  const t=todayYmd();const dates=new Set(visibleDates());
  for(let i=-1;i<15;i++)dates.add(shiftYmd(t,i));
  for(const date of dates){
    if(materialized.has(date))continue;materialized.add(date);
    const dow=fromYmd(date).getDay();
    for(const r of Object.values(state.routines)){
      if(!(r.days||[]).includes(dow))continue;
      if(r.from&&date<r.from)continue;
      if(r.until&&date>r.until)continue;
      if((r.skips||[]).includes(date))continue;
      const id=r.id+'_'+date;if(state.blocks[id])continue;
      put('blocks',id,{id,title:r.title,date,start:r.start,duration:r.duration,projectId:r.projectId||null,icon:r.icon||null,routineId:r.id,createdAt:Date.now()});
    }
  }
}

/* ============ smart capture ============ */
const DAYRE='(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)';
const MONRE='(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
function parseCapture(raw){
  let text=' '+(raw||'').trim()+' ';
  const out={title:'',projectName:null,urgency:0,due:null,dueTime:null};
  text=text.replace(/\s(!{1,3})(?=\s)/,(m,b)=>{out.urgency=b.length;return' '});
  text=text.replace(/\s@([^\s@!]+)/,(m,n)=>{out.projectName=n;return' '});
  text=text.replace(/\s(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=[\s.,])/i,(m,h,mi,ap)=>{let H=(+h)%12;if(ap.toLowerCase()==='pm')H+=12;out.dueTime=pad(H)+':'+(mi||'00');return' '});
  if(!out.dueTime)text=text.replace(/\s(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)(?=[\s.,])/,(m,h,mi)=>{out.dueTime=pad(+h)+':'+mi;return' '});
  text=text.replace(/\s~?(\d+(?:\.\d+)?)\s?(?:h|hr|hrs|hours?)(?:\s?(\d{1,2})\s?(?:m|min|mins)?)?(?=[\s.,])/i,(m,h,mm)=>{out.est=Math.round(+h*60+(+mm||0));return' '});
  if(!out.est)text=text.replace(/\s~?(\d{1,3})\s?(?:m|min|mins|minutes)(?=[\s.,])/i,(m,mm)=>{out.est=+mm;return' '});
  const today=new Date();today.setHours(0,0,0,0);
  const set=d=>{out.due=ymd(d);return' '};
  const rules=[
    [/\s(today|tod|tonight)(?=[\s.,])/i,()=>set(today)],
    [/\s(tomorrow|tmrw|tmr)(?=[\s.,])/i,()=>set(addDays(today,1))],
    [/\s(?:in\s+)(\d+)\s*(day|days|d|week|weeks|w)(?=[\s.,])/i,(m,n,u)=>set(addDays(today,+n*(u[0]==='w'?7:1)))],
    [new RegExp('\\s(?:on\\s+)?(next\\s+)?'+DAYRE+'(?=[\\s.,])','i'),(m,next,d)=>{
      const want=WD.map(x=>x.toLowerCase().slice(0,3)).indexOf(d.toLowerCase().slice(0,3));
      let diff=(want-today.getDay()+7)%7;if(diff===0)diff=7;if(next&&diff<7)diff+=7;return set(addDays(today,diff))}],
    [new RegExp('\\s(?:on\\s+)?'+MONRE+'\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?=[\\s.,])','i'),(m,mo,d)=>set(monthDay(mo,d,today))],
    [new RegExp('\\s(?:on\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+'+MONRE+'(?=[\\s.,])','i'),(m,d,mo)=>set(monthDay(mo,d,today))],
    [/\s(?:on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=[\s.,])/,(m,a,b,y)=>{let d=new Date(today.getFullYear(),+a-1,+b);if(y)d.setFullYear(+y<100?2000+ +y:+y);else if(d<today)d.setFullYear(d.getFullYear()+1);return set(d)}],
  ];
  for(const [re,fn] of rules){if(out.due)break;text=text.replace(re,fn)}
  text=text.replace(/\s+/g,' ').trim().replace(/\s+(at|on|by)$/i,'').replace(/^(at|on|by)\s+/i,'');
  out.title=text;return out;
}
function monthDay(mo,d,today){
  const mi=MN.map(x=>x.toLowerCase()).indexOf(mo.toLowerCase().slice(0,3));
  let dt=new Date(today.getFullYear(),mi,+d);if(dt<today)dt.setFullYear(dt.getFullYear()+1);return dt;
}
function createTaskFromText(text,extra={}){
  const p=parseCapture(text);
  let projectId=extra.projectId||null;
  if(p.projectName)projectId=findOrCreateProject(p.projectName).id;
  const id=uid('t');
  const t={id,title:p.title||'Untitled task',projectId,urgency:extra.urgency??p.urgency,due:extra.due!==undefined?extra.due:p.due,dueTime:extra.dueTime!==undefined?extra.dueTime:p.dueTime,blockId:extra.blockId||null,done:false,createdAt:Date.now(),notes:'',est:p.est||0};
  if(!t.est&&typeof guessEst==='function'){const g=guessEst(t.title,t.projectId);if(g){t.est=g;t.estAuto=true}}
  put('tasks',id,t);return t;
}
function previewChips(text){
  const p=parseCapture(text);const chips=[];
  if(p.due)chips.push(fmtDay(p.due)+(p.dueTime?' '+fmtTime(fromHM(p.dueTime)):''));else if(p.dueTime)chips.push(fmtTime(fromHM(p.dueTime)));
  if(p.projectName){const ex=Object.values(state.projects).find(x=>x.name.toLowerCase()===p.projectName.toLowerCase());chips.push((ex?'':'New project: ')+p.projectName)}
  if(p.est)chips.push('~'+fmtDur(p.est));
  if(p.urgency)chips.push(['','Matters','Important','Urgent'][p.urgency]);
  return chips.map(c=>`<span>${esc(c)}</span>`).join('');
}

let renderQueued=false,pendingRender=false;
function scheduleRender(){
  if(renderQueued)return;renderQueued=true;
  requestAnimationFrame(()=>{renderQueued=false;
    const a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&!a.closest('#overlay')){pendingRender=true;return}
    if(G.mode||PROV){pendingRender=true;return}
    renderApp();refreshSheet();
  });
}

/* ---- timeline ---- */
function timelineHtml(){
  const dates=visibleDates();const n=dates.length;
  const hs=state.settings.dayStart,he=state.settings.dayEnd;const H=he-hs;const hh=hourPx();const t=todayYmd();const nm=nowMin();
  let gutter='<div class="gutter">';
  for(let h=hs;h<=he;h++){const y=(h-hs)*hh;if(dates.includes(t)&&Math.abs((nm-hs*60)/60*hh-y)<13)continue;gutter+=`<span style="top:${y}px">${fmtHour(h)}</span>`}
  if(dates.includes(t)&&nm>=hs*60&&nm<=he*60)gutter+=`<span class="nowlbl" style="top:${(nm-hs*60)/60*hh}px">${fmtTimeShort(nm)}</span>`;
  gutter+='</div>';
  const head=n>1?`<div class="tl-head" style="--n:${n}"><div></div>${dates.map(d=>{const dd=fromYmd(d);return`<div class="dhd ${d===t?'today':''}">${WD[dd.getDay()].toUpperCase()}<b>${dd.getDate()}</b></div>`}).join('')}</div>`:'';
  return`${head}<div class="tl-grid ${ui.dayAnim}" style="--n:${n};--hour:${hh}px;height:${H*hh+58}px">${gutter}${dates.map(dayColHtml).join('')}</div>`;
}
function layoutLanes(blocks){
  const sorted=[...blocks].sort((a,b)=>a.start-b.start||b.duration-a.duration);
  const res={};let cluster=[],clusterEnd=-1;
  const flush=()=>{const ends=[];cluster.forEach(b=>{let l=ends.findIndex(e=>e<=b.start);if(l<0){l=ends.length;ends.push(0)}ends[l]=blockEnd(b);res[b.id]={lane:l}});cluster.forEach(b=>res[b.id].lanes=ends.length);cluster=[]};
  sorted.forEach(b=>{if(cluster.length&&b.start>=clusterEnd){flush();clusterEnd=-1}cluster.push(b);clusterEnd=Math.max(clusterEnd,blockEnd(b))});
  if(cluster.length)flush();return res;
}
function dayColHtml(date){
  const blocks=blocksOn(date);const lanes=layoutLanes(blocks);
  const hs=state.settings.dayStart*60,he=state.settings.dayEnd*60;const hh=hourPx();const t=todayYmd();const n=nowMin();
  const cur=currentBlock();const clash=conflictsOn(date);
  const items=blocks.map(b=>{
    const L=lanes[b.id];const s=Math.max(b.start,hs),e=Math.min(blockEnd(b),he);if(e<=s)return'';
    const top=(s-hs)/60*hh;const h=Math.max(30,(e-s)/60*hh-4);
    const col=colorOf(b.projectId);const tasks=tasksIn(b.id);
    const past=date<t||(date===t&&blockEnd(b)<=n);
    const w=100/L.lanes;const left=L.lane*w;
    const open=tasks.filter(x=>!x.done).length;
    const room=Math.floor((h-66)/18);let lis='';
    if(room>=1&&tasks.length){const show=tasks.slice(0,room);const more=tasks.length-show.length;
      lis='<ul>'+show.map(x=>`<li class="${x.done?'done':''}"><i></i>${esc(x.title)}</li>`).join('')+(more>0?`<li class="more"><i></i>${more} more</li>`:'')+'</ul>'}
    const meta=tasks.length?(open?`${open} scheduled task${open===1?'':'s'}`:`${tasks.length} done`):'';
    return`<div class="block ${past?'past':''} ${cur&&cur.id===b.id?'focusing':''} ${ui.freshBlock===b.id?'fresh':''} ${clash.has(b.id)?'clash':''}" role="button" tabindex="0" data-act="block:open" data-id="${b.id}" style="top:${top}px;height:${h}px;left:calc(${left}% + 4px);width:calc(${w}% - 8px);${cvars(col)}">
      <div class="bh"><span class="bic">${ico(blockIcon(b),2.2)}</span><span class="bt">${esc(b.title)}</span><span class="bd">${clash.has(b.id)?'⚠ ':''}${fmtDur(b.duration)}</span></div>
      ${h>=52&&meta?`<div class="bm">${meta}</div>`:''}${lis}</div>`;
  }).join('');
  const now=date===t&&n>=hs&&n<=he?`<div class="nowline" style="top:${(n-hs)/60*hh}px"></div>`:'';
  const empty=!blocks.length&&!isWide()?`<div class="empty-day"><b>Give the day a shape</b>Tap a time to add a block, or hold a to do and carry it here.</div>`:'';
  return`<div class="daycol" data-date="${date}">${items}${now}${empty}</div>`;
}

function tickFocus(){
  const cd=$('#cd');if(!cd)return;const b=focusBlock();if(!b)return;
  const now=new Date();const t=todayYmd();const sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const s=b.start*60,e=blockEnd(b)*60;const cl=$('#cl'),pr=$('#prog');let big,sub,p=0;
  if(b.date===t&&sec>=s&&sec<e){const r=e-sec;big=r>=60?`${Math.ceil(r/60)}<small>min</small>`:`${r}<small>s</small>`;sub=`until ${fmtTime(blockEnd(b))}`;p=(sec-s)/(e-s)}
  else if(b.date>t||(b.date===t&&sec<s)){const u=b.date===t?s-sec:(fromYmd(b.date)-fromYmd(t))/1000+s-sec;big=u<3600?`in ${Math.ceil(u/60)}<small>min</small>`:u<86400?`in ${Math.ceil(u/3600)}<small>h</small>`:`in ${Math.round(u/86400)}<small>d</small>`;sub=`${fmtDay(b.date)}, starts ${fmtTime(b.start)}`}
  else{big=`<small>ended</small>`;sub=`${fmtTime(b.start)} – ${fmtTime(blockEnd(b))}, ${fmtDur(b.duration)}`;p=1}
  if(big!==lastCd){cd.innerHTML=big;lastCd=big}if(cl)cl.textContent=sub;if(pr)pr.style.width=(p*100).toFixed(1)+'%';
}

const G={pending:null,timer:null,mode:null,drag:null,suppressClick:false};

document.addEventListener('touchstart',()=>{},{passive:true});
function slotTime(col,clientY){const cr=col.getBoundingClientRect();const hs=state.settings.dayStart*60;let m=hs+Math.round((clientY-cr.top)/hourPx()*60/15)*15;return Math.max(0,Math.min(1425,m))}
document.addEventListener('pointerdown',e=>{
  if(e.button)return;G.pending=null;G.mode=null;clearTimeout(G.timer);

  const task=e.target.closest('.task[data-task]');const block=e.target.closest('.block[data-id]');const proj=e.target.closest('.proj[data-pid]');
  if(SW.open&&(!task||task!==SW.open)&&!e.target.closest('.swr'))closeSwipe();
  if(task){if(e.target.closest('.swr'))return;G.pending={kind:'task',el:task,id:task.dataset.task,sx:e.clientX,sy:e.clientY,mouse:e.pointerType==='mouse',draggable:!!task.closest('.draggable')}}
  else if(block&&block.closest('.timeline')){G.pending={kind:'block',el:block,id:block.dataset.id,sx:e.clientX,sy:e.clientY,mouse:e.pointerType==='mouse',draggable:true}}
  else if(proj&&proj.dataset.pid!=='inbox'){G.pending={kind:'proj',el:proj,id:proj.dataset.pid,sx:e.clientX,sy:e.clientY,mouse:e.pointerType==='mouse'};if(!G.pending.mouse)G.timer=setTimeout(()=>{if(G.pending&&!G.mode){G.mode='projedit';haptic(12);openSheet(projectSheet(G.pending.id))}},480);return}
  else{const col=e.target.closest('.daycol');if(col&&!e.target.closest('.block')){if(PROV){return}G.pending={kind:'slot',el:col,sx:e.clientX,sy:e.clientY,mouse:e.pointerType==='mouse',start:slotTime(col,e.clientY)};

    return}
  if(!G.pending.mouse&&G.pending.draggable)G.timer=setTimeout(()=>{if(G.pending&&!G.mode)liftDrag()},380);
},{passive:true});
document.addEventListener('pointermove',e=>{
  const p=G.pending;if(!p)return;const dx=e.clientX-p.sx,dy=e.clientY-p.sy;
  if(G.mode==='drag'){moveDrag(e);return}
  if(G.mode==='swipe'){moveSwipe(dx);return}
  if(G.mode==='sheet'){p.el.style.transition='none';p.el.style.transform=`translateY(${Math.max(0,dy)}px)`;return}
  if(G.mode==='calresize'){const pts=calPoints();p.el.classList.add('resizing');p.el.style.height=Math.max(pts.min,Math.min(pts.full+40,p.h0+dy))+'px';return}
  if(G.mode==='dayswipe'){const g=$('.tl-grid');if(g){g.style.transition='none';g.style.transform=`translateX(${dx*.35}px)`;g.style.opacity=String(Math.max(.5,1-Math.abs(dx)/400))}return}
  if(G.mode==='slotdrag'){moveProvisional(slotTime(p.el,e.clientY-p.offset));return}
  if(G.mode==='draw'){const a=p.start,b=slotTime(p.el,e.clientY);const s=Math.min(a,b),d=Math.max(15,Math.abs(b-a));moveProvisional(s,d);return}
  if(G.mode==='projedit')return;

  if(p.kind==='task'){const wrap=document.createElement('div');wrap.className='task';wrap.style.setProperty('--c',p.el.style.getPropertyValue('--c'));const inner=p.el.querySelector('.inner').cloneNode(true);inner.style.transform='';wrap.appendChild(inner);ghost.appendChild(wrap)}

      if(d.newStart!==start)haptic(3);d.newStart=start;d.newDate=col.dataset.date}

}
function flyGhost(ghost,rect,done){

/* ============ smart scheduling (rule-based, runs on the device) ============ */
const SCHED_ICON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>';
const SPARK=ico('sun',2);
function snapshotState(){return clone(Object.fromEntries(COLLS.map(c=>[c,state[c]||{}])))}
function restoreSnapshot(s){for(const coll of COLLS){const cur=state[coll]||{},old=s[coll]||{};for(const id of new Set([...Object.keys(cur),...Object.keys(old)])){if(JSON.stringify(cur[id]||null)!==JSON.stringify(old[id]||null))put(coll,id,old[id]||null)}}materialized.clear();syncRoutines();renderApp();refreshSheet()}
function redrawSheet(){const b=$('.sbody');const st=b?b.scrollTop:0;drawSheet();const b2=$('.sbody');if(b2)b2.scrollTop=st}
const P=()=>{const s=state.settings;return{focusS:s.focusStart??540,focusE:s.focusEnd??720,buffer:s.buffer??5,breakAfter:s.breakAfter??90,breakLen:15,lunch:s.lunch===undefined?750:(s.lunch<0?null:s.lunch),lunchLen:30,rollover:s.rollover!==false}};
const isDeep=t=>(t.est||30)>=45||(t.urgency||0)>=3;
function prio(t,date){let s=(t.urgency||0)*25;if(t.due){const d=Math.round((fromYmd(t.due)-fromYmd(date))/86400000);s+=d<0?90:d===0?50:d<=3?30-d*6:0}if(t.dueTime)s+=10;s+=Math.min(15,(Date.now()-(t.createdAt||Date.now()))/86400000);return s}
function busyFor(date){const p=P();const b=blocksOn(date).map(x=>[x.start,blockEnd(x)]);if(p.lunch!=null)b.push([p.lunch,p.lunch+p.lunchLen]);return b}
function dayFrom(date){const t=todayYmd();const hs=state.settings.dayStart*60;if(date<t)return 1440;return date===t?Math.max(hs,Math.ceil((nowMin()+5)/15)*15):hs}
function gaps(date,busy,from){const p=P();const he=state.settings.dayEnd*60;let cur=from;const out=[];
  for(const [s,e] of [...busy].sort((a,b)=>a[0]-b[0])){const s2=s-p.buffer,e2=e+p.buffer;if(s2>cur)out.push([cur,Math.min(s2,he)]);cur=Math.max(cur,e2)}
  if(he>cur)out.push([cur,he]);return out.map(g=>[Math.ceil(g[0]/5)*5,g[1]]).filter(g=>g[1]-g[0]>=15)}
function fit(gs,dur,o={}){for(const [a,b] of gs){let s=a;let end=b;if(o.win){s=Math.max(s,o.win[0]);end=Math.min(b,o.win[1])}if(s+dur<=end&&(!o.before||s+dur<=o.before))return s}return null}
function runStart(iv,s,buf){let st=s,ch=true;while(ch){ch=false;for(const [a,b] of iv){if(b<=st&&b>=st-buf-1&&a<st){st=a;ch=true}}}return st}
function unscheduledOn(date){return tasksForDay(date).filter(t=>!t.done&&!(t.blockId&&state.blocks[t.blockId])).length}

function smartPlan(date,o={}){
  const p=P();const t0=todayYmd();const from=dayFrom(date);const busy=busyFor(date);const blocksOnly=blocksOn(date).map(x=>[x.start,blockEnd(x)]);
  const inBlock=t=>t.blockId&&state.blocks[t.blockId]&&state.blocks[t.blockId].date>=date;
  let tasks=tasksArr().filter(t=>!t.done&&!inBlock(t)&&(taskDay(t)===date||(date===t0&&taskDay(t)&&taskDay(t)<t0)));
  const fromBacklog=new Set();
  if(o.fill){let room=capacity()-plannedMinutes(date)-blocksOn(date).filter(b=>!tasksIn(b.id).length).reduce((s,b)=>s+b.duration,0);
    for(const t of backlogTasks().filter(t=>!tasks.includes(t)).sort((a,b)=>prio(b,date)-prio(a,date))){const d=t.est||30;if(d<=room){tasks.push(t);fromBacklog.add(t.id);room-=d}if(room<15)break}}
  tasks.sort((a,b)=>prio(b,date)-prio(a,date));
  const items=[];
  const quick=tasks.filter(t=>(t.est||30)<=15&&!t.dueTime);
  for(const t of tasks.filter(t=>!quick.includes(t))){const dur=Math.max(15,Math.round((t.est||30)/15)*15);const deep=isDeep(t);const before=t.dueTime&&t.due===date?fromHM(t.dueTime):null;
    const g=!deep&&before==null&&items.find(u=>!u.deep&&u.before==null&&!u.quick&&u.projectId===(t.projectId||null)&&u.dur+dur<=120);
    if(g){g.tasks.push(t);g.dur+=dur}else items.push({tasks:[t],dur,deep,before,projectId:t.projectId||null,score:prio(t,date)})}
  for(let i=0;i<quick.length;){let dur=0;const grp=[];while(i<quick.length&&dur+(quick[i].est||15)<=60){dur+=quick[i].est||15;grp.push(quick[i]);i++}items.push({tasks:grp,dur:Math.max(15,Math.ceil(dur/15)*15),quick:true,projectId:null,before:null,score:Math.max(...grp.map(t=>prio(t,date)))-5})}
  const order=[...items.filter(i=>i.before!=null).sort((a,b)=>a.before-b.before),...items.filter(i=>i.before==null&&i.deep).sort((a,b)=>b.score-a.score),...items.filter(i=>i.before==null&&!i.deep).sort((a,b)=>b.score-a.score)];
  const anyDeep=items.some(i=>i.deep);const placed=[],unplaced=[];
  const place=(it,s)=>{const e=s+it.dur;busy.push([s,e]);blocksOnly.push([s,e]);placed.push({...it,start:s});const rs=runStart(blocksOnly,s,p.buffer);if(p.breakAfter&&e-rs>=p.breakAfter)busy.push([e,e+p.breakLen])};
  for(const it of order){
    const prefs=it.deep?[[p.focusS,p.focusE],null]:anyDeep?[[0,p.focusS],[p.focusE,1440],null]:[null];
    let s=null;for(const w of prefs){s=fit(gaps(date,busy,from),it.dur,{win:w,before:it.before});if(s!=null)break}
    if(s==null&&it.before!=null){s=fit(gaps(date,busy,from),it.dur);if(s!=null)it.late=true}
    if(s==null){unplaced.push(...it.tasks);continue}place(it,s);
  }
  const blocks=placed.sort((a,b)=>a.start-b.start).map(it=>{const pr=it.projectId&&state.projects[it.projectId];const tags=[];
    if(it.deep&&it.start>=p.focusS&&it.start+it.dur<=p.focusE)tags.push(['Focus hours','focus']);
    if(it.quick)tags.push([`${it.tasks.length} quick win${it.tasks.length===1?'':'s'}`,'quick']);
    if(it.before!=null)tags.push(it.late?['Runs past '+fmtTimeShort(it.before),'late']:['Done by '+fmtTimeShort(it.before),'due']);
    if(it.tasks.some(t=>t.due&&t.due<date))tags.push(['Overdue','late']);
    if(it.tasks.some(t=>fromBacklog.has(t.id)))tags.push(['From backlog','bl']);
    const title=it.quick?'Quick wins':it.tasks.length===1?it.tasks[0].title:pr?pr.name:it.tasks[0].title+' +'+(it.tasks.length-1);
    return{title:title.slice(0,60),start:it.start,duration:it.dur,projectId:it.projectId,taskIds:it.tasks.map(t=>t.id),on:true,tags}});
  const reason=!tasks.length?(o.fill?'The backlog is empty and nothing is planned for '+fmtDay(date).toLowerCase()+'.':'Nothing planned for '+fmtDay(date).toLowerCase()+' needs a slot. Switch to “+ Backlog” to pull from the backlog.'):'No free time left on '+fmtDay(date).toLowerCase()+'.';
  return{date,fill:!!o.fill,blocks,unplaced,reason,canFill:backlogTasks().length>0};
}
function applySmart(pl,withToast=true){
  const items=pl.blocks.filter(b=>b.on);if(!items.length)return 0;const snap=snapshotState();
  items.forEach(b=>{const bid=createBlock({title:b.title,date:pl.date,start:b.start,duration:b.duration,projectId:b.projectId});b.taskIds.forEach(id=>{const t=state.tasks[id];if(t)put('tasks',id,{...t,blockId:bid,due:t.due&&t.due>=pl.date?t.due:pl.date})})});

  if(withToast)toast(`Added ${items.length} block${items.length===1?'':'s'} to ${fmtDay(pl.date)}`,{label:'Undo',fn:()=>restoreSnapshot(snap)});
  return items.length;
}
function autoTimebox(date){return applySmart(smartPlan(date),false)}

/* find a time for one to do */
function findSlots(dur,deep,n){const p=P();const out=[];const t=todayYmd();
  for(let k=0;k<14&&out.length<n;k++){const date=shiftYmd(t,k);const gs=gaps(date,busyFor(date),dayFrom(date));let per=0;
    if(deep){const s=fit(gs,dur,{win:[p.focusS,p.focusE]});if(s!=null){out.push({date,start:s,focus:true});per++}}
    for(const [a,b] of gs){if(per>=2||out.length>=n)break;if(a+dur<=b&&!out.some(x=>x.date===date&&Math.abs(x.start-a)<dur)){out.push({date,start:a});per++}}}
  return out.slice(0,n)}
function findSheet(id){return()=>{const t=state.tasks[id];if(!t)return`${snav('Find a time',{act:'sheet:close',label:'Close'})}<div class="sbody"><div class="empty">This to do was removed.</div></div>`;
  const dur=Math.max(15,Math.round((t.est||30)/15)*15);const slots=findSlots(dur,isDeep(t),7);let last='';
  const rows=slots.map(s=>{const head=s.date!==last?`${last?'</div>':''}<div class="pick-day">${esc(fmtDay(s.date))}</div><div class="card">`:'';last=s.date;
    const late=t.due&&s.date>t.due;return head+`<button class="pick" data-act="sched:slot" data-id="${id}" data-date="${s.date}" data-start="${s.start}" style="--c:${colorOf(t.projectId)}"><span class="bic">${ico('calendar',2)}</span><div class="pt"><div>${fmtTimeShort(s.start)} – ${fmtTimeShort(s.start+dur)}</div><small>${s.focus?'In your focus hours':'Next free gap'}${late?', after the due date':''}</small></div></button>`}).join('')+(slots.length?'</div>':'');
  return`${snav('Find a time',{act:'sheet:close',label:'Cancel'})}<div class="fnote" style="padding:0 16px 6px">${esc(t.title)}, ${fmtDur(dur)}${t.est?'':' (no estimate, using 30m)'}</div><div class="sbody">${rows||'<div class="empty">No free gap that long in the next two weeks.</div>'}</div>`}}
PI.calendar='<rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>';

/* running late, conflicts, quick blocks, free time */
function pushRest(m){const t=todayYmd();const n=nowMin();const cur=currentBlock();const list=blocksOn(t).filter(b=>b.start>=n&&(!cur||b.id!==cur.id));if(!list.length&&!cur)return 0;const snap=snapshotState();
  list.forEach(b=>put('blocks',b.id,{...b,start:Math.min(1425,b.start+m)}));if(cur)put('blocks',cur.id,{...cur,duration:cur.duration+m});renderApp();

function conflictsOn(date){const bl=blocksOn(date);const ids=new Set();for(let i=0;i<bl.length;i++)for(let j=i+1;j<bl.length;j++)if(bl[j].start<blockEnd(bl[i])&&bl[i].start<blockEnd(bl[j])){ids.add(bl[i].id);ids.add(bl[j].id)}return ids}
function fixConflicts(date){const p=P();const t=todayYmd();const bl=blocksOn(date).sort((a,b)=>a.start-b.start||(a.createdAt||0)-(b.createdAt||0));let end=-1,moved=0;const snap=snapshotState();
  for(const b of bl){const movable=date>t||(date===t&&b.start>=nowMin());if(end>b.start&&movable){const ns=Math.min(1425,Math.ceil((end+p.buffer)/5)*5);put('blocks',b.id,{...state.blocks[b.id],start:ns});moved++;end=ns+b.duration}else end=Math.max(end,blockEnd(b))}
  renderApp();if(moved)toast(`Moved ${moved} block${moved===1?'':'s'} so nothing overlaps`,{label:'Undo',fn:()=>restoreSnapshot(snap)});else toast('Overlaps are in blocks that already started');return moved}
function quickBlock(text){const p=parseCapture(text);if(!p.title)return{err:'Type what the block is for'};const t=todayYmd();const date=p.due||(ui.date>=t?ui.date:t);const dur=Math.max(15,p.est||60);
  let start=p.dueTime?fromHM(p.dueTime):null;if(start==null){start=fit(gaps(date,busyFor(date),dayFrom(date)),dur);if(start==null)return{err:`No free ${fmtDur(dur)} left on ${fmtDay(date)}`}}
  const pid=p.projectName?findOrCreateProject(p.projectName).id:(currentProject()?currentProject().id:null);const id=createBlock({title:p.title,date,start,duration:dur,projectId:pid});return{id,date,start}}
function freeSummary(date){const gs=gaps(date,busyFor(date),dayFrom(date));const total=gs.reduce((s,g)=>s+g[1]-g[0],0);const lg=gs.reduce((m,g)=>g[1]-g[0]>(m?m[1]-m[0]:0)?g:m,null);
  const hs=state.settings.dayStart*60,he=state.settings.dayEnd*60,span=he-hs;const seg=(a,b,c)=>`<i class="${c}" style="left:${(a-hs)/span*100}%;width:${(b-a)/span*100}%"></i>`;
  const bar=`<div class="freebar">${blocksOn(date).map(b=>seg(Math.max(hs,b.start),Math.min(he,blockEnd(b)),'b')).join('')}${date===todayYmd()?seg(hs,Math.min(he,nowMin()),'past'):''}</div><div class="freelbl"><span>${fmtTimeShort(hs)}</span><span>${fmtTimeShort(he)}</span></div>`;
  return{total,lg,bar,text:total?`${fmtDur(total)} free in ${gs.length} gap${gs.length===1?'':'s'}. Longest ${fmtDur(lg[1]-lg[0])} from ${fmtTimeShort(lg[0])}.`:'No free time left.'}}

/* learned estimates */
const words=s=>new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2));
function guessEst(title,projectId){const w=words(title);if(!w.size)return 0;let best=0,bs=0;
  for(const t of tasksArr()){const m=t.actual||(t.done&&!t.estAuto?t.est:0);if(!m)continue;const tw=words(t.title);let inter=0;w.forEach(x=>{if(tw.has(x))inter++});const j=inter/(w.size+tw.size-inter);const sc=j+(projectId&&t.projectId===projectId?.1:0);if(j>=.5&&sc>bs){bs=sc;best=m}}
  return best?Math.max(15,Math.round(best/15)*15):0}

  blocksOn(t).forEach(b=>{const ks=b.id+':s',ke=b.id+':e';try{

/* ---- rituals ---- */
let R=null;
const rseg=(id,val,opts)=>`<div class="seg mini">${opts.map(([k,l])=>`<button class="${val===k?'on':''}" data-act="ritual:move" data-id="${id}" data-v="${k}">${l}</button>`).join('')}</div>`;
const rrow=(t,extra)=>`<div class="rrow"><div class="rt"><div>${esc(t.title)}</div><small>${t.projectId&&state.projects[t.projectId]?esc(state.projects[t.projectId].name):''}${t.est?(t.projectId?', ':'')+fmtDur(t.est):''}</small></div>${extra}</div>`;
function overdueFor(date){return sortTasks(tasksArr().filter(x=>!x.done&&x.due&&x.due<date&&!(x.blockId&&state.blocks[x.blockId]&&state.blocks[x.blockId].date>=date)))}
function startRitual(kind,date){
  const dd=dayDoc(date);R={kind,date,step:0,moves:{},picks:new Set(),obj:dd.objective||'',refl:dd.reflection||'',applied:false,boxed:null};
  if(kind==='plan'){overdueFor(date).forEach(t=>R.moves[t.id]='today');tasksForDay(date).filter(t=>!t.done).forEach(t=>R.picks.add(t.id))}
  else{const tm=shiftYmd(date,1);tasksForDay(date).filter(t=>!t.done).forEach(t=>R.moves[t.id]='tomorrow');tasksForDay(tm).filter(t=>!t.done).forEach(t=>R.picks.add(t.id))}
  openSheet(ritualSheet);
}
function ritualSheet(){
  const r=R;const date=r.date;const tm=shiftYmd(date,1);const steps=r.kind==='plan'?5:4;
  const dots=`<div class="rdots">${Array.from({length:steps},(_,k)=>`<i class="${k<=r.step?'on':''}"></i>`).join('')}</div>`;
  const nav=(title,last)=>snav(title,r.step>0?{act:'ritual:back',label:'Back'}:{act:'sheet:close',label:'Cancel'},{act:last?'ritual:finish':'ritual:next',label:last?'Finish':'Next'});
  let body='';
  if(r.kind==='plan'){
    const od=overdueFor(date);
    if(r.step===0){
      const cands=[...od.map(t=>t.id),...backlogTasks().map(t=>t.id)].filter((v,i,a)=>a.indexOf(v)===i);
      const total=cands.length;
      body=`${nav('Plan '+fmtDay(date))}<div class="sbody">${dots}<div class="rintro"><div class="rbig">${SPARK}</div><h3>Let’s shape ${esc(fmtDay(date).toLowerCase())}</h3><p>${od.length?`${od.length} to do${od.length===1?'':'s'} slipped from earlier days. `:''}${backlogTasks().length?`${backlogTasks().length} in the backlog. `:''}You’ll pick what matters, size it, set an intention, and put it on the calendar.</p></div></div>`;
    }else if(r.step===1){
      body=`${nav('Slipped')}<div class="sbody">${dots}<div class="fnote" style="padding:0 0 10px">${od.length?'What should happen to these?':'Nothing slipped. Nice.'}</div><div class="card">${od.map(t=>rrow(t,rseg(t.id,r.moves[t.id]||'today',[['today',fmtDay(date)==='Today'?'Today':'Move'],['backlog','Backlog'],['done','Done']]))).join('')||'<div class="empty">All caught up.</div>'}</div></div>`;
    }else if(r.step===2){
      const already=tasksForDay(date).filter(t=>!t.done);const moved=od.filter(t=>r.moves[t.id]==='today');
      const cand=sortTasks(backlogTasks().filter(t=>!r.moves[t.id]));const soon=sortTasks(tasksArr().filter(t=>!t.done&&t.due&&t.due>date&&t.due<=shiftYmd(date,6)&&!t.blockId));
      const pickMin=[...already,...moved,...tasksArr().filter(t=>r.picks.has(t.id)&&!already.includes(t))].reduce((s,t)=>s+(t.est||0),0);
      const item=t=>`<label class="rrow pick"><input type="checkbox" data-act="ritual:pick" data-id="${t.id}" ${r.picks.has(t.id)?'checked':''}><div class="rt"><div>${esc(t.title)}</div><small>${t.projectId&&state.projects[t.projectId]?esc(state.projects[t.projectId].name):''}${t.due?(t.projectId?', ':'')+'due '+esc(fmtDay(t.due)):''}${t.est?', '+fmtDur(t.est):''}</small></div></label>`;
      body=`${nav('Pick')}<div class="sbody">${dots}<div class="fnote" style="padding:0 0 10px">Already on the day: ${already.length+moved.length}. Picked time: <b id="rpick">${fmtDur(pickMin)}</b> of ${fmtDur(capacity())}.</div>
        ${soon.length?`<div class="fnote" style="padding:0 0 6px">Coming up this week</div><div class="card">${soon.map(item).join('')}</div>`:''}
        <div class="fnote" style="padding:12px 0 6px">Backlog</div><div class="card">${cand.slice(0,40).map(item).join('')||'<div class="empty">Backlog is empty.</div>'}</div></div>`;
    }else if(r.step===3){
      const list=ritualDayTasks();
      body=`${nav('Size it')}<div class="sbody">${dots}<div class="fnote" style="padding:0 0 10px">How long will each take? Tap to set.</div><div id="rwork">${workloadPreview(list)}</div>
        <div class="card">${list.map(t=>`<div class="rrow est" data-id="${t.id}"><div class="rt"><div>${esc(t.title)}</div></div><div class="chips scroll-x" style="padding:0;background:none">${[15,30,45,60,90,120].map(m=>`<button class="chip sm ${(r.est&&r.est[t.id]!==undefined?r.est[t.id]:t.est)===m?'on':''}" data-act="ritual:est" data-id="${t.id}" data-v="${m}">${fmtDur(m)}</button>`).join('')}</div></div>`).join('')||'<div class="empty">Nothing picked yet.</div>'}</div></div>`;
    }else if(r.step===4){
      const n=r.boxed;
      body=`${nav('Timebox',true)}<div class="sbody">${dots}<div class="card"><div class="frow" style="display:block"><b>What would make ${esc(fmtDay(date).toLowerCase())} a success?</b><input class="rinput" data-act="ritual:obj" value="${esc(r.obj)}" placeholder="One line, e.g. Ship the proposal" autocomplete="off"></div></div>
        ${objectivesHtml(date)}
        <div class="fnote" style="padding:14px 0 6px">Put it on the calendar</div><div class="card"><button class="frow" data-act="ritual:auto" style="width:100%"><label style="min-width:0;flex:1">Smart schedule<small style="display:block;font-size:13px;color:var(--label2)">${n==null?'Deep work in focus hours, quick wins batched, breaks added':n?`Added ${n} block${n===1?'':'s'}`:'No free time left'}</small></label>${I.chevR.replace('<svg','<svg class="chevr"')}</button>
        </div></div>`;
    }
  }else{
    const all=tasksForDay(date);const done=all.filter(t=>t.done);const open=all.filter(t=>!t.done);
    if(r.step===0){const planned=all.reduce((s,t)=>s+(t.est||0),0),actual=all.reduce((s,t)=>s+(t.actual||0),0);const fb=blocksOn(date).length;
      body=`${nav('Shutdown')}<div class="sbody">${dots}<div class="rintro"><h3>${done.length?`${done.length} done ${esc(fmtDay(date).toLowerCase())}`:'Wrapping up'}</h3><p>${open.length?`${open.length} still open. `:'Everything planned got done. '}${planned?`Planned ${fmtDur(planned)}`:''}${actual?`${planned?', ':''}logged ${fmtDur(actual)}`:''}${fb?`${planned||actual?', ':''}${fb} block${fb===1?'':'s'}`:''}.</p></div>
        ${done.length?`<div class="card">${done.map(t=>rrow(t,'<span style="color:var(--green)">✓</span>')).join('')}</div>`:''}</div>`;
    }else if(r.step===1){
      body=`${nav('Unfinished')}<div class="sbody">${dots}<div class="fnote" style="padding:0 0 10px">${open.length?'Where should these go?':'Nothing left open.'}</div><div class="card">${open.map(t=>rrow(t,rseg(t.id,r.moves[t.id]||'tomorrow',[['tomorrow','Tomorrow'],['backlog','Backlog'],['done','Done']]))).join('')||'<div class="empty">Clean slate.</div>'}</div></div>`;
    }else if(r.step===2){
      body=`${nav('Reflect')}<div class="sbody">${dots}<div class="card"><div class="frow" style="display:block"><b>How did the day go?</b><textarea class="rinput" data-act="ritual:refl" rows="4" placeholder="A line or two. What worked, what to change.">${esc(r.refl)}</textarea></div></div></div>`;
    }else if(r.step===3){
      const tmTasks=tasksForDay(tm).filter(t=>!t.done);const moving=open.filter(t=>(r.moves[t.id]||'tomorrow')==='tomorrow');const cand=sortTasks(backlogTasks());
      const item=t=>`<label class="rrow pick"><input type="checkbox" data-act="ritual:pick" data-id="${t.id}" ${r.picks.has(t.id)?'checked':''}><div class="rt"><div>${esc(t.title)}</div><small>${t.projectId&&state.projects[t.projectId]?esc(state.projects[t.projectId].name):''}${t.est?(t.projectId?', ':'')+fmtDur(t.est):''}</small></div></label>`;
      body=`${nav('Tomorrow',true)}<div class="sbody">${dots}<div class="fnote" style="padding:0 0 10px">${moving.length?`${moving.length} moving over from today. `:''}Anything else for ${esc(fmtDay(tm).toLowerCase())}?</div>
        ${tmTasks.length?`<div class="fnote" style="padding:0 0 6px">Already planned</div><div class="card">${tmTasks.map(item).join('')}</div>`:''}
        <div class="fnote" style="padding:12px 0 6px">Backlog</div><div class="card">${cand.slice(0,40).map(item).join('')||'<div class="empty">Backlog is empty.</div>'}</div></div>`;
    }
  }
  return body;
}
function ritualDayTasks(){const r=R;const date=r.date;const ids=new Set(tasksForDay(date).filter(t=>!t.done).map(t=>t.id));overdueFor(date).forEach(t=>{if((r.moves[t.id]||'today')==='today')ids.add(t.id)});r.picks.forEach(id=>ids.add(id));return sortTasks([...ids].map(id=>state.tasks[id]).filter(Boolean))}
function workloadPreview(list){const r=R;const total=list.reduce((s,t)=>s+((r.est&&r.est[t.id]!==undefined)?r.est[t.id]:(t.est||0)),0);const cap=capacity();const pct=Math.min(100,Math.round(total/cap*100));return`<div class="workload ${total>cap?'over':pct>80?'warn':''}" style="margin:0 0 12px"><div class="wbar"><i style="width:${pct}%"></i></div><span>${fmtDur(total)} of ${fmtDur(cap)}${total>cap?'. Over capacity, consider dropping something':''}</span></div>`}
function applyPlanRitual(){
  const r=R;if(r.applied)return;const date=r.date;
  overdueFor(date).forEach(t=>{const m=r.moves[t.id]||'today';if(m==='today')planTask(t.id,date);else if(m==='backlog')planTask(t.id,null);else if(m==='done')put('tasks',t.id,{...t,done:true,doneAt:Date.now()})});
  r.picks.forEach(id=>{const t=state.tasks[id];if(t&&taskDay(t)!==date)planTask(id,date)});
  if(r.est)for(const id in r.est){const t=state.tasks[id];if(t)put('tasks',id,{...t,est:r.est[id]})}
  setDay(date,{objective:r.obj.trim(),planned:true});r.applied=true;renderApp();
}
function finishShutdown(){
  const r=R;const date=r.date;const tm=shiftYmd(date,1);
  tasksForDay(date).filter(t=>!t.done).forEach(t=>{const m=r.moves[t.id]||'tomorrow';if(m==='tomorrow')planTask(t.id,tm);else if(m==='backlog')planTask(t.id,null);else put('tasks',t.id,{...state.tasks[t.id],done:true,doneAt:Date.now()})});
  r.picks.forEach(id=>{const t=state.tasks[id];if(t&&taskDay(t)!==tm)planTask(id,tm)});
  setDay(date,{reflection:r.refl.trim(),shutdown:true});
}
function weekStats(ws){const days=Array.from({length:7},(_,k)=>shiftYmd(ws,k));const ts=tasksArr().filter(t=>days.includes(taskDay(t))||(t.done&&t.doneAt&&days.includes(ymd(new Date(t.doneAt)))));const done=ts.filter(t=>t.done).length;const planned=ts.reduce((s,t)=>s+(t.est||0),0);const actual=ts.reduce((s,t)=>s+(t.actual||0),0);const blocks=Object.values(state.blocks).filter(b=>days.includes(b.date));const focus=blocks.reduce((s,b)=>s+b.duration,0);const objs=Object.values(state.objectives).filter(o=>o.week==='W'+ws);return{done,total:ts.length,planned,actual,blocks:blocks.length,focus,objDone:objs.filter(o=>o.done).length,objTotal:objs.length}}
function weekReviewSheet(){return()=>{const ws=weekStartOf(ui.date);const s=weekStats(ws);const d=dayDoc('W'+ws);const we=fromYmd(shiftYmd(ws,6)),w0=fromYmd(ws);

function promptSheet(title,value,placeholder,cb){return()=>`${snav(title,{act:'sheet:close',label:'Cancel'},{act:'noop',label:'Save',form:'promptForm'})}<div class="sbody"><form id="promptForm" data-act="prompt:save"><div class="card"><div class="frow big"><input name="v" value="${esc(value||'')}" placeholder="${esc(placeholder)}" autofocus autocomplete="off" aria-label="${esc(title)}"></div></div></form></div>`}

    case'day:objective':{const date=el.dataset.date;askText('Intention for '+fmtDay(date),dayDoc(date).objective||'','What would make it a success?',v=>{setDay(date,{objective:v});renderApp()});break}
    case'obj:add':{const wk=el.dataset.week;askText('Weekly objective','','e.g. Ship the proposal',v=>{if(!v)return;const oid=uid('o');put('objectives',oid,{id:oid,text:v,week:wk,done:false,createdAt:Date.now()});renderApp();refreshSheet()});break}
    case'obj:toggle':{const o=state.objectives[id];if(!o)return;if(e&&e.detail===2){}put('objectives',id,{...o,done:!o.done});haptic(6);renderApp();refreshSheet();break}
    case'prompt:save':{const v=(readForm(el).v||'').trim();const cb=promptCb;promptCb=null;closeSheet();if(cb)cb(v);break}
    case'auto:timebox':{const n=autoTimebox(el.dataset.date);haptic(10);renderApp();refreshSheet();toast(n?`Added ${n} block${n===1?'':'s'}`:'Nothing to place, or no free time left');break}
    case'ritual:plan':startRitual('plan',el.dataset.date);break;
    case'ritual:shutdown':startRitual('shutdown',el.dataset.date);break;
    case'ritual:next':{if(R.kind==='plan'&&R.step===3)applyPlanRitual();R.step++;if(R.kind==='plan'&&R.step===1&&!overdueFor(R.date).length)R.step=2;drawSheet();break}
    case'ritual:back':{R.step--;if(R.kind==='plan'&&R.step===1&&!overdueFor(R.date).length)R.step=0;drawSheet();break}
    case'ritual:move':{R.moves[id]=el.dataset.v;$$(`.seg button[data-id="${id}"]`,el.closest('.sheet')).forEach(b=>b.classList.toggle('on',b===el));haptic(4);break}
    case'ritual:pick':{if(el.checked)R.picks.add(id);else R.picks.delete(id);const p=$('#rpick');if(p){const list=ritualDayTasks();p.textContent=fmtDur(list.reduce((s,t)=>s+(t.est||0),0))}break}
    case'ritual:est':{R.est=R.est||{};R.est[id]=+el.dataset.v;el.closest('.chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));const w=$('#rwork');if(w)w.innerHTML=workloadPreview(ritualDayTasks());haptic(4);break}
    case'ritual:auto':{if(!R.applied)applyPlanRitual();R.boxed=autoTimebox(R.date);haptic(10);renderApp();drawSheet();break}
    case'ritual:finish':{if(R.kind==='plan'){if(!R.applied)applyPlanRitual();else setDay(R.date,{objective:R.obj.trim(),planned:true});toast('Day planned')}else{finishShutdown();toast('Day closed. See you tomorrow')}R=null;closeAllSheets();haptic(12);renderApp();break}
  }
}
document.addEventListener('input',e=>{const el=e.target;if(!R)return;if(el.dataset.act==='ritual:obj')R.obj=el.value;if(el.dataset.act==='ritual:refl')R.refl=el.value});
setInterval(tickTimer,1000);

/* ---- init ---- */
loadLocal();applyTheme();syncRoutines();renderApp();initDb();setTimeout(autoRollover,2500);
setInterval(tickFocus,1000);
setInterval(()=>{updateNowLine();checkNotify()},20000);
let lastDay=todayYmd();
setInterval(()=>{if(todayYmd()!==lastDay){lastDay=todayYmd();materialized.clear();syncRoutines();renderApp();autoRollover()}},60000);
let wasWide=isWide();
window.addEventListener('resize',()=>{if(isWide()!==wasWide){wasWide=isWide();closeAllSheets();renderApp()}else if(!isWide()){const c=$('.cal');if(c&&!G.mode)c.style.height=calHeight()+'px'}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){scheduleRender();tickFocus()}});
</script>
</body>
</html>
